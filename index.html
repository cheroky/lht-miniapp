<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --txt: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #6d6d72);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btntxt: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-section-bg-color, var(--bg));
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg: var(--tg-theme-bg-color,#1c1c1e); --bg2: var(--tg-theme-secondary-bg-color,#000);
      --txt: var(--tg-theme-text-color,#fff); --hint: var(--tg-theme-hint-color,#8e8e93);
      --card: var(--tg-theme-section-bg-color,#1c1c1e); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg2);color:var(--txt);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px 14px calc(24px + env(safe-area-inset-bottom));}
  h1{font-size:26px;margin:4px 2px 2px}
  .sub{color:var(--hint);font-size:14px;margin:0 2px 16px}
  .filtros{display:flex;gap:8px;margin:0 0 14px}
  .filtros button{flex:1;border:0;border-radius:10px;padding:10px 0;font-size:15px;font-weight:600;
    background:var(--card);color:var(--txt)}
  .filtros button.on{background:var(--btn);color:var(--btntxt)}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--btn);color:var(--btntxt)}
  .fecha{color:var(--hint);font-size:14px}
  .ep{font-size:17px;font-weight:600;margin:2px 0 12px}
  .acc{display:flex;gap:8px}
  .acc button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
  .play{flex:1;background:var(--btn);color:var(--btntxt)}
  .sec{background:var(--bg2);color:var(--link)}
  iframe{width:100%;height:120px;border:0;border-radius:10px;margin-top:12px;display:block}
</style>
</head>

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
function abrir(url){ if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank"); }
function abrirTG(url){ if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank"); }
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let filtro = "todos";
function pintar(){
  const lista = PROGRAMAS.filter(p => filtro === "todos" || p.show === filtro);
  document.getElementById("sub").textContent = lista.length + " programas · el más nuevo primero";
  document.getElementById("lista").innerHTML = lista.map((p, i) => `
    <div class="card" id="c${i}">
      <div class="top"><span class="tag">${p.show}</span><span class="fecha">${p.fecha}</span></div>
      <div class="ep">${esc(p.ep || p.show)}</div>
      <div class="acc">
        <button class="play" data-i="${i}">▶ Escuchar</button>
        <button class="sec" data-sc="${esc(p.url)}">SoundCloud</button>
        <button class="sec" data-tg="https://t.me/lhtnooficial/${p.msg}">Canal</button>
      </div>
    </div>`).join("");
  lista.forEach((p, i) => {
    const card = document.getElementById("c" + i);
    card.querySelector(".play").onclick = (e) => {
      let f = card.querySelector("iframe");
      if (f) { f.remove(); e.target.textContent = "▶ Escuchar"; return; }
      document.querySelectorAll("iframe").forEach(x => { x.remove(); });
      document.querySelectorAll(".play").forEach(b => b.textContent = "▶ Escuchar");
      f = document.createElement("iframe");
      f.allow = "autoplay";
      f.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(p.url) +
              "&auto_play=true&visual=false&show_comments=false&show_teaser=false&color=%23" +
              ((tg && tg.themeParams && tg.themeParams.button_color) || "#2481cc").replace("#","");
      card.appendChild(f);
      e.target.textContent = "■ Cerrar";
    };
    card.querySelector("[data-sc]").onclick = () => abrir(p.url);
    card.querySelector("[data-tg]").onclick = () => abrirTG("https://t.me/lhtnooficial/" + p.msg);
  });
}
document.querySelectorAll(".filtros button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".filtros button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filtro = b.dataset.f; pintar();
});
pintar();
</script>
